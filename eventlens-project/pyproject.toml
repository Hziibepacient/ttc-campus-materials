[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventlens"
version = "0.2.0"
description = "Local, reviewable dwell counting for fixed-camera and timelapse event videos"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8", "onnxruntime>=1.17", "scipy>=1.10"]

[project.scripts]
eventlens = "eventlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eventlens = ["skill/eventlens/SKILL.md"]
